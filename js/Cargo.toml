[package]
name = "tiktoken-fast-js"
version = "0.1.1"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
tiktoken-fast = { path = ".." }
wasm-bindgen = "=0.2.100"
js-sys = "0.3"
base64 = "0.22"
memchr = "2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
