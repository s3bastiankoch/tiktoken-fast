[package]
name = "tiktoken-fast-node"
version = "0.1.2"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
tiktoken-fast = { path = ".." }
napi = { version = "2", default-features = false, features = ["napi4"] }
napi-derive = "2"
memchr = "2"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
