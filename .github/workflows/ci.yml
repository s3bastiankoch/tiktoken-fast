name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: parity tests
        run: cargo test --release
      - name: differential soak, 60 s
        run: cargo run --release --example soak -- 60 tests/corpora
      - name: exhaustive short strings
        run: cargo run --release --example exhaustive -- 3 ctx

  bench-builds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            bench/compare
            bench/threads
      - run: cargo build --release --manifest-path bench/compare/Cargo.toml
      - run: cargo build --release --manifest-path bench/threads/Cargo.toml

  python:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: build and install the wheel
        shell: bash
        run: |
          python -m pip install "maturin>=1.5,<2" tiktoken numpy pytest
          cd python && maturin build --release -o dist
          python -m pip install --no-index --find-links dist tiktoken-fast
      - name: parity with tiktoken
        run: python -m pytest -q python/tests

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo install wasm-bindgen-cli --version 0.2.100 --locked
      - run: js/build.sh
      - name: parity with the tiktoken npm package
        working-directory: js/bench
        run: npm install && node ../test/parity.mjs

  node-native:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: build the addon
        shell: bash
        run: node/build.sh
      - name: parity with the tiktoken npm package
        shell: bash
        working-directory: js/bench
        run: npm install && TKF_PKG="$GITHUB_WORKSPACE/node/index.js" node ../test/parity.mjs

  go:
    strategy:
      fail-fast: false
      matrix:
        go: ['1.19', 'stable']
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: gofmt
        if: matrix.go == 'stable'
        run: test -z "$(gofmt -l .)"

  go-bench-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: identical token ids against tiktoken-go
        working-directory: go/bench
        run: go vet ./... && go test -count=1 -run 'TestSameTokens' .
      - name: cross-language harness still builds
        working-directory: go/bench/vsrust
        run: go vet ./... && go build ./...
