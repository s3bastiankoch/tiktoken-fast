name: bench

# The quick benchmark on GitHub's own runners, for numbers from a machine the
# authors do not control. Shared runners are noisier than the pinned VMs of the
# README; rounds are paired, so the speed-ups hold up better than the raw times.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

jobs:
  quick:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: cargo install wasm-bindgen-cli --version 0.2.100 --locked
      - name: quick run
        run: QUICK=1 CORE=1 bench/reproduce.sh
      - name: summary
        if: always()
        run: cat bench/results/*/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-${{ matrix.os }}
          path: bench/results/*-quick
