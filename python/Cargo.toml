[package]
name = "tiktoken-fast-python"
version = "0.1.2"
edition = "2021"
license = "MIT"
description = "Python bindings of tiktoken-fast"
repository = "https://github.com/s3bastiankoch/tiktoken-fast"
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py310"] }
tiktoken-fast = { path = ".." }
memchr = "2"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
