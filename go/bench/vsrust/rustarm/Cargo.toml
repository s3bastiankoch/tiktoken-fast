[package]
name = "rustarm"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
# tiktoken-rs vendors openai/tiktoken's own Rust core (src/vendor_tiktoken.rs)
# and ships the same .tiktoken vocabularies, so this arm is the reference
# implementation rather than a third-party reimplementation of it.
tiktoken-rs = "0.12.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
